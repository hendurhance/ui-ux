name: Link Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out what to check
        id: scope
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            # A brand-new branch reports an all-zero "before" ref.
            if ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
              BEFORE=$(git rev-parse "${{ github.sha }}^" 2>/dev/null || echo "")
            fi
            if [ -z "$BEFORE" ]; then
              echo "No usable base commit. Skipping."
              echo "skip=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            # Only lines ADDED by this push, and only the URLs on them.
            git diff -U0 "$BEFORE" "${{ github.sha }}" -- '*.md' \
              | grep -E '^\+' | grep -Ev '^\+\+\+' \
              | grep -oE 'https?://[^)"'"'"' >]+' \
              | sed 's/[.,]$//' | sort -u > changed-urls.txt || true
            COUNT=$(wc -l < changed-urls.txt | tr -d ' ')
            echo "New or changed URLs in this push: $COUNT"
            if [ "$COUNT" -eq 0 ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
            else
              # Wrap as markdown so lychee treats each line as a link.
              sed 's|^|- <|; s|$|>|' changed-urls.txt > changed-urls.md
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "target=changed-urls.md" >> "$GITHUB_OUTPUT"
              cat changed-urls.txt
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "target=./**/*.md" >> "$GITHUB_OUTPUT"
          fi

      - name: Check links
        id: lychee
        if: steps.scope.outputs.skip != 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,301,302,307,308,403,429,999
            --max-concurrency 8
            --timeout 25
            --retry-wait-time 5
            --max-retries 3
            --exclude '^https://img\.shields\.io'
            --exclude '^https://github\.com/hendurhance/ui-ux/(issues|tree|sponsors)'
            --exclude '^mailto:'
            ${{ steps.scope.outputs.target }}
          output: lychee-report.md
          fail: false


      - name: Fail when a newly added link is broken
        if: github.event_name == 'push' && steps.lychee.outputs.exit_code != 0
        run: |
          echo "----- broken links added in this push -----"
          cat lychee-report.md
          cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
          echo "::error::One or more links added in this push are broken. Report printed above."
          exit 1


      - name: Open an issue when the weekly sweep finds breakage
        if: github.event_name != 'push' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links — weekly sweep"
          content-filepath: lychee-report.md
          labels: |
            broken-link
            maintenance

      - name: Report a clean run
        if: steps.scope.outputs.skip == 'true' || steps.lychee.outputs.exit_code == 0
        run: echo "No broken links." >> "$GITHUB_STEP_SUMMARY"
