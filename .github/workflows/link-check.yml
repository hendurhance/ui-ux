name: Link Check

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
  schedule:
    - cron: '0 6 * * 1'   # Mondays, 06:00 UTC
  workflow_dispatch:       # lets you run it on demand from the Actions tab

permissions:
  contents: read
  issues: write

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to diff against the previous commit

      - name: Work out which files to check
        id: scope
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            # Only the markdown touched by this push.
            FILES=$(git diff --name-only --diff-filter=d \
                      ${{ github.event.before }} ${{ github.sha }} \
                    | grep -E '\.md$' | tr '\n' ' ')
            if [ -z "$FILES" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "No markdown changed. Nothing to check."
            else
              echo "skip=false" >> "$GITHUB_OUTPUT"
              echo "files=$FILES" >> "$GITHUB_OUTPUT"
              echo "Checking changed files: $FILES"
            fi
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "files=./**/*.md" >> "$GITHUB_OUTPUT"
            echo "Full sweep."
          fi

      - name: Check links
        id: lychee
        if: steps.scope.outputs.skip != 'true'
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,403,429,999
            --max-concurrency 8
            --timeout 25
            --retry-wait-time 5
            --max-retries 2
            --exclude '^https://img\.shields\.io'
            --exclude '^https://github\.com/hendurhance/ui-ux/(issues|tree|sponsors)'
            --exclude '^mailto:'
            ${{ steps.scope.outputs.files }}
          output: lychee-report.md
          fail: false   # we decide what to do with the result ourselves

      - name: Fail the push when a changed file has a broken link
        if: github.event_name == 'push' && steps.lychee.outputs.exit_code != 0
        run: |
          echo "::error::Broken links in the files you just changed."
          cat lychee-report.md >> "$GITHUB_STEP_SUMMARY"
          exit 1

      - name: Open an issue when the weekly sweep finds breakage
        if: github.event_name != 'push' && steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Broken links — weekly sweep"
          content-filepath: lychee-report.md
          labels: |
            broken-link
            maintenance

      - name: Report a clean run
        if: steps.lychee.outputs.exit_code == 0
        run: echo "All links resolved." >> "$GITHUB_STEP_SUMMARY"
